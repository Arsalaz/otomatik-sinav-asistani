<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - EduAI Asistan</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="background-animation"></div>
    
    <div class="login-container glass-card">
        <div class="login-header">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <h2>EduAI'a Hoş Geldiniz</h2>
            <p>Lütfen giriş yapmak istediğiniz rolü seçin</p>
        </div>

        <div class="role-selector">
            <button class="role-btn active" id="btnTeacher">
                <i class="fa-solid fa-chalkboard-user"></i> Öğretmen
            </button>
            <button class="role-btn" id="btnStudent">
                <i class="fa-solid fa-user-graduate"></i> Öğrenci
            </button>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> E-Posta Adresi</label>
                <input type="email" id="email" name="email" autocomplete="username" class="login-input" placeholder="ornek@okul.edu.tr" required>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Şifre</label>
                <input type="password" id="password" name="password" autocomplete="current-password" class="login-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">
                Giriş Yap <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
            
            <div class="auth-divider">veya</div>
            
            <button type="button" class="btn-outline" id="registerBtn" style="width: 100%; justify-content: center;">
                Yeni Hesap Oluştur
            </button>
        </form>
    </div>

    <!-- Firebase Auth Scriptleri (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
</body>
</html>
